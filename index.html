<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Caption Pramuka</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --scout-dark: #4B3621; /* Cokelat Tua Pramuka */
      --scout-light: #C19A6B; /* Cokelat Muda/Hasduk */
      --scout-accent: #FFD700; /* Emas/Kuning Tunas Kelapa */
      --bg-dark: #1a140f;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--bg-dark), #2d1e12);
      color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: rgba(75, 54, 33, 0.2);
      backdrop-filter: blur(15px);
      border: 2px solid var(--scout-light);
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      color: var(--scout-accent);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 1.5rem;
    }

    p.subtitle {
      font-size: 0.9rem;
      margin-bottom: 25px;
      color: var(--scout-light);
    }

    .form-group { text-align: left; margin-bottom: 15px; }

    label { display: block; margin-bottom: 5px; color: var(--scout-light); font-size: 0.85rem; }

    select, input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(193, 154, 107, 0.3);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-family: inherit;
      outline: none;
    }

    select:focus, input:focus { border-color: var(--scout-accent); }

    .btn {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: var(--scout-light);
      color: var(--scout-dark);
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      text-transform: uppercase;
    }

    .btn:hover { background: var(--scout-accent); transform: translateY(-2px); }

    .btn-copy { background: transparent; border: 1px solid var(--scout-accent); color: var(--scout-accent); margin-top: 10px; }

    textarea { margin-top: 20px; resize: none; background: rgba(255,255,255,0.05); height: 150px; }

    .footer { margin-top: 25px; font-size: 0.75rem; color: rgba(193, 154, 107, 0.6); }
  </style>
</head>
<body>

<div class="container">
  <h1>⚜️ Scouter Caption ⚜️</h1>
  <p class="subtitle">Satu Pramuka untuk Satu Indonesia</p>

  <div class="form-group">
    <label>Pilih Template:</label>
    <select id="templateSelect" onchange="generateDynamicFields()">
      <option value="">-- Pilih Kegiatan --</option>
    </select>
  </div>

  <div id="dynamicFields"></div>

  <button class="btn" onclick="generateCaption()">🔥 Buat Caption</button>
  
  <textarea id="resultCaption" readonly placeholder="Hasil caption akan muncul di sini..."></textarea>
  
  <button class="btn btn-copy" onclick="copyToClipboard()">📋 Salin Caption</button>

  <div class="footer">
    © 2026 Tim Cyber Pramuka<br>
    Satyaku Kudarmakan, Darmaku Kubaktikan.
  </div>
</div>

<script>
// Data diambil dari caption.json yang kamu upload
const captionData = [
    {
        "title": "PESERTA MPLS 2025",
        "content": "BACK TO SCHOOL‼️🏫\n\nHaloo sobat SMANIX👋\nSaya {nama} dari {sekolah}\n\nSIAP MENGIKUTI KEGIATAN\n✨MPLS SMANIX 2025✨\n\n{katakata}\n\n#nationix #scout #pramukaupdate"
    },
    {
        "title": "PANITIA LDKS 2025",
        "content": "LEADERSHIP TIME‼️🔥\n\nHalo sobat SMANIX👋\nSaya {nama} Kelas {kelas} selaku Panitia LDKS\n\nSIAP MENYUKSESKAN KEGIATAN\n✨LDKS SMANIX 2025✨\n\nMoto Hidup : {moto}\n\nLEAD WITH CHARACTER‼️"
    }
];

const templateSelect = document.getElementById('templateSelect');
const dynamicFields = document.getElementById('dynamicFields');
const resultCaption = document.getElementById('resultCaption');

// Load options
captionData.forEach((item, index) => {
    let opt = document.createElement('option');
    opt.value = index;
    opt.innerHTML = item.title;
    templateSelect.appendChild(opt);
});

function generateDynamicFields() {
    const selected = captionData[templateSelect.value];
    dynamicFields.innerHTML = "";
    if (!selected) return;

    const matches = selected.content.match(/{(.*?)}/g) || [];
    const uniqueFields = [...new Set(matches)];

    uniqueFields.forEach(match => {
        const fieldName = match.replace(/[{}]/g, "");
        dynamicFields.innerHTML += `
            <div class="form-group">
                <label>${fieldName.charAt(0).toUpperCase() + fieldName.slice(1)}:</label>
                <input type="text" class="user-input" data-key="${match}" placeholder="Isi ${fieldName}...">
            </div>
        `;
    });
}

function generateCaption() {
    const selected = captionData[templateSelect.value];
    if (!selected) return alert("Pilih template dulu, Kak!");

    let finalContent = selected.content;
    const inputs = document.querySelectorAll('.user-input');
    
    inputs.forEach(input => {
        finalContent = finalContent.replaceAll(input.getAttribute('data-key'), input.value || "...");
    });

    resultCaption.value = finalContent;
}

function copyToClipboard() {
    resultCaption.select();
    document.execCommand("copy");
    alert("✅ Caption berhasil disalin!");
}
</script>

</body>
</html>
