<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portal Twibbon Pramuka</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pramuka-coklat: #8B4513;
      --pramuka-coklat-gelap: #5D2906;
      --pramuka-kuning: #FFD700;
      --pramuka-kuning-muda: #FFF8DC;
      --pramuka-hijau: #228B22;
      --pramuka-hijau-muda: #90EE90;
      --bg-dark: #2C1810;
      --card-bg: rgba(139, 69, 19, 0.15);
      --border: rgba(255, 215, 0, 0.3);
      --text-light: #FFF8DC;
      --text-muted: #D2B48C;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--bg-dark), #1a0f08);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.6s ease forwards;
      overflow: hidden;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 50px 40px;
      width: 90%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      animation: slideUp 0.6s ease forwards;
    }

    .logo-pramuka {
      width: 80px;
      height: 80px;
      margin: 0 auto 15px;
      background: var(--pramuka-kuning);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      border: 3px solid var(--pramuka-coklat);
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
    }

    h1 {
      font-size: 28px;
      color: var(--pramuka-kuning);
      margin-bottom: 8px;
      font-weight: 700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 30px;
      font-style: italic;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      border: 2px solid var(--pramuka-kuning);
      cursor: pointer;
      text-decoration: none;
      background: linear-gradient(135deg, var(--pramuka-coklat), var(--pramuka-coklat-gelap));
      color: var(--pramuka-kuning);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
      background: linear-gradient(135deg, var(--pramuka-coklat-gelap), var(--pramuka-coklat));
    }

    .btn-secondary {
      background: none;
      border: 2px solid var(--pramuka-kuning);
      color: var(--pramuka-kuning);
      font-size: 14px;
      padding: 10px 16px;
      border-radius: 10px;
      transition: all 0.2s ease;
      display: inline-block;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: var(--pramuka-kuning);
      color: var(--pramuka-coklat-gelap);
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #A0522D;
      letter-spacing: 0.5px;
      border-top: 1px solid rgba(255,215,0,0.2);
      padding-top: 15px;
    }

    .tali-knot {
      display: inline-block;
      margin: 0 5px;
      color: var(--pramuka-kuning);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-pramuka">⚜️</div>
    <h1>PORTAL TWIBBON</h1>
    <p class="subtitle">"Satyaku Kudarmakan, Darmaku Kubaktikan"</p>

    <a href="peserta.html" class="btn" onclick="navigateWithTransition(event)">🎓 Twibbon Peserta</a>
    <a href="panitia.html" class="btn" onclick="navigateWithTransition(event)">🛠️ Twibbon Panitia</a>
    <a href="caption.html" class="btn" onclick="navigateWithTransition(event)">📝 Caption</a>

    <div class="footer">
      <span class="tali-knot">🪢</span>
      © 2025 Pramuka - Gerakan Pramuka Indonesia<br>
      Dibangun dengan Semangat Dasa Darma
      <span class="tali-knot">🪢</span>
    </div>
  </div>

  <script>
    function navigateWithTransition(event) {
      event.preventDefault();
      const target = event.currentTarget.getAttribute("href");
      document.body.style.animation = "fadeOut 0.4s forwards";
      setTimeout(() => { window.location.href = target; }, 400);
    }
  </script>
</body>
</html>
